<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="AbatoTransGlobal — World-class translation, localization, interpretation and global language solutions.">
    <meta name="theme-color" content="#0F172A">

    <title>AbatoTransGlobal | Bridging Worlds Through Precision Language</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           ROOT / GLOBAL
        ========================================================= */

        :root {
            --navy: #0F172A;
            --navy-dark: #080E1C;
            --navy-light: #17233A;
            --gold: #EAB308;
            --gold-light: #FACC15;
            --gold-dark: #CA8A04;
            --white: #FFFFFF;
            --slate-white: #F8FAFC;
            --slate-100: #F1F5F9;
            --slate-200: #E2E8F0;
            --slate-400: #94A3B8;
            --slate-500: #64748B;
            --slate-600: #475569;
            --slate-700: #334155;
            --success: #22C55E;

            --container: 1200px;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;

            --shadow-sm: 0 5px 20px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 15px 40px rgba(15, 23, 42, 0.10);
            --shadow-lg: 0 25px 70px rgba(15, 23, 42, 0.15);

            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 90px;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--slate-white);
            color: var(--navy);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
            border: none;
        }

        img,
        svg {
            display: block;
            max-width: 100%;
        }

        .container {
            width: min(var(--container), calc(100% - 40px));
            margin-inline: auto;
        }

        .section {
            padding: 110px 0;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--gold-dark);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .section-label::before {
            content: "";
            width: 28px;
            height: 2px;
            background: var(--gold);
        }

        .section-title {
            max-width: 760px;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            line-height: 1.08;
            letter-spacing: -0.04em;
            margin-bottom: 20px;
        }

        .section-title span {
            color: var(--gold-dark);
        }

        .section-description {
            max-width: 650px;
            color: var(--slate-500);
            font-size: 1.05rem;
        }

        /* =========================================================
           NAVIGATION
        ========================================================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 82px;
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-container {
            width: min(var(--container), calc(100% - 40px));
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            color: var(--white);
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            white-space: nowrap;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-left: auto;
        }

        .nav-links a {
            position: relative;
            color: #CBD5E1;
            font-size: 0.86rem;
            font-weight: 600;
            transition: color var(--transition);
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width var(--transition);
        }

        .nav-links a:hover {
            color: var(--white);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 9px;
            background: var(--gold);
            color: var(--navy);
            font-size: 0.82rem;
            font-weight: 800;
            transition: all var(--transition);
            box-shadow: 0 8px 25px rgba(234, 179, 8, 0.2);
        }

        .nav-cta:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(234, 179, 8, 0.3);
        }

        .menu-toggle {
            display: none;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: white;
            align-items: center;
            justify-content: center;
        }

        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            position: relative;
            min-height: 100vh;
            padding: 150px 0 90px;
            display: flex;
            align-items: center;
            overflow: hidden;
            color: var(--white);
            background:
                radial-gradient(circle at 80% 25%, rgba(234,179,8,0.13), transparent 28%),
                radial-gradient(circle at 15% 70%, rgba(59,130,246,0.10), transparent 30%),
                linear-gradient(135deg, #0F172A 0%, #0B1220 55%, #080E1C 100%);
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 700px;
            height: 700px;
            right: -300px;
            top: 50px;
            border: 1px solid rgba(234,179,8,0.12);
            border-radius: 50%;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            right: -200px;
            top: 150px;
            border: 1px solid rgba(234,179,8,0.08);
            border-radius: 50%;
        }

        .hero-grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 70px;
            align-items: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(234,179,8,0.28);
            border-radius: 100px;
            background: rgba(234,179,8,0.07);
            color: #FDE68A;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .eyebrow-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 15px var(--gold);
        }

        .hero h1 {
            max-width: 820px;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: clamp(3rem, 7vw, 5.9rem);
            line-height: 0.99;
            letter-spacing: -0.065em;
            margin-bottom: 25px;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero-description {
            max-width: 650px;
            color: #CBD5E1;
            font-size: 1.12rem;
            line-height: 1.8;
            margin-bottom: 34px;
        }

        .hero-description strong {
            color: var(--white);
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 65px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 52px;
            padding: 0 24px;
            border-radius: 9px;
            font-size: 0.87rem;
            font-weight: 800;
            transition: all var(--transition);
        }

        .btn-primary {
            background: var(--gold);
            color: var(--navy);
            box-shadow: 0 15px 35px rgba(234,179,8,0.2);
        }

        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-3px);
            box-shadow: 0 20px 45px rgba(234,179,8,0.3);
        }

        .btn-secondary {
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(255,255,255,0.05);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(234,179,8,0.45);
            transform: translateY(-3px);
        }

        /* Hero visual */

        .hero-visual {
            position: relative;
            min-height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .globe-card {
            position: relative;
            width: min(430px, 100%);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, rgba(234,179,8,0.15), transparent 32%),
                linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.015));
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow:
                0 0 80px rgba(234,179,8,0.08),
                inset 0 0 70px rgba(255,255,255,0.02);
        }

        .globe-card::before,
        .globe-card::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(234,179,8,0.22);
        }

        .globe-card::before {
            inset: 32px;
        }

        .globe-card::after {
            inset: 75px;
            border-color: rgba(255,255,255,0.1);
        }

        .globe-svg {
            width: 58%;
            color: var(--gold);
            filter: drop-shadow(0 0 20px rgba(234,179,8,0.25));
        }

        .floating-card {
            position: absolute;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            background: rgba(15,23,42,0.82);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-lg);
        }

        .floating-card strong {
            display: block;
            color: var(--white);
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 1.35rem;
            margin-bottom: 2px;
        }

        .floating-card span {
            color: var(--slate-400);
            font-size: 0.72rem;
        }

        .floating-one {
            left: 0;
            top: 80px;
        }

        .floating-two {
            right: -5px;
            bottom: 100px;
        }

        .floating-three {
            left: 40px;
            bottom: 15px;
        }

        .stats-bar {
            position: relative;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            max-width: 850px;
            padding-top: 28px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .stat {
            padding-right: 30px;
            margin-right: 30px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .stat:last-child {
            border-right: 0;
        }

        .stat strong {
            display: block;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 1.45rem;
            color: var(--white);
        }

        .stat span {
            color: var(--slate-400);
            font-size: 0.78rem;
        }

        /* =========================================================
           TRUST STRIP
        ========================================================= */

        .trust-strip {
            background: var(--white);
            border-bottom: 1px solid var(--slate-200);
            padding: 22px 0;
        }

        .trust-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            color: var(--slate-500);
        }

        .trust-inner p {
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .trust-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 30px;
        }

        .trust-items span {
            font-size: 0.82rem;
            font-weight: 700;
        }

        /* =========================================================
           SERVICES
        ========================================================= */

        .services {
            background: var(--slate-white);
        }

        .section-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 50px;
            margin-bottom: 55px;
        }

        .section-heading .section-description {
            max-width: 450px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .service-card {
            position: relative;
            min-height: 290px;
            padding: 30px;
            border: 1px solid var(--slate-200);
            border-radius: var(--radius-lg);
            background: var(--white);
            overflow: hidden;
            transition: all var(--transition);
        }

        .service-card::after {
            content: "";
            position: absolute;
            width: 140px;
            height: 140px;
            right: -80px;
            bottom: -80px;
            border-radius: 50%;
            background: rgba(234,179,8,0.10);
            transition: all 0.45s ease;
        }

        .service-card:hover {
            transform: translateY(-7px);
            border-color: rgba(234,179,8,0.5);
            box-shadow: var(--shadow-md);
        }

        .service-card:hover::after {
            width: 210px;
            height: 210px;
        }

        .service-number {
            position: absolute;
            right: 25px;
            top: 22px;
            color: var(--slate-200);
            font-size: 0.72rem;
            font-weight: 800;
        }

        .service-icon {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            margin-bottom: 25px;
            border-radius: 13px;
            background: rgba(234,179,8,0.10);
            color: var(--gold-dark);
        }

        .service-card h3 {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 1.12rem;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .service-card p {
            position: relative;
            z-index: 2;
            color: var(--slate-500);
            font-size: 0.88rem;
            line-height: 1.7;
        }

        /* =========================================================
           LANGUAGE PAIRS
        ========================================================= */

        .languages {
            position: relative;
            color: var(--white);
            background:
                radial-gradient(circle at 10% 20%, rgba(234,179,8,0.09), transparent 25%),
                linear-gradient(145deg, var(--navy), var(--navy-dark));
            overflow: hidden;
        }

        .languages::before {
            content: "A";
            position: absolute;
            right: 5%;
            top: 0;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 30rem;
            line-height: 1;
            font-weight: 800;
            color: rgba(255,255,255,0.015);
            pointer-events: none;
        }

        .language-header {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 40px;
            margin-bottom: 50px;
        }

        .language-header .section-title {
            color: var(--white);
        }

        .language-header .section-description {
            color: var(--slate-400);
        }

        .language-grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .language-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            min-height: 86px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 13px;
            background: rgba(255,255,255,0.035);
            transition: all var(--transition);
        }

        .language-card:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(234,179,8,0.45);
            transform: translateY(-3px);
        }

        .language-name {
            font-size: 0.88rem;
            font-weight: 700;
        }

        .language-code {
            color: var(--gold);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .language-arrow {
            color: var(--slate-500);
        }

        /* =========================================================
           SPECIALIZATIONS
        ========================================================= */

        .specializations {
            background: var(--white);
        }

        .industry-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-top: 55px;
        }

        .industry-card {
            position: relative;
            min-height: 220px;
            padding: 25px;
            border: 1px solid var(--slate-200);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: linear-gradient(145deg, #FFFFFF, #F8FAFC);
            transition: all var(--transition);
        }

        .industry-card:hover {
            border-color: rgba(234,179,8,0.5);
            transform: translateY(-5px);
            box-shadow: var(--shadow-sm);
        }

        .industry-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            margin-bottom: 35px;
            border-radius: 11px;
            background: var(--navy);
            color: var(--gold);
        }

        .industry-card h3 {
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 0.95rem;
            line-height: 1.35;
        }

        .industry-card p {
            margin-top: 8px;
            color: var(--slate-500);
            font-size: 0.75rem;
        }

        /* =========================================================
           WHY CHOOSE US
        ========================================================= */

        .why-us {
            background: var(--slate-white);
        }

        .why-grid {
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            gap: 80px;
            align-items: center;
        }

        .why-visual {
            position: relative;
            min-height: 500px;
            border-radius: var(--radius-xl);
            overflow: hidden;
            background:
                linear-gradient(145deg, rgba(234,179,8,0.10), transparent),
                var(--navy);
            border: 1px solid rgba(15,23,42,0.08);
        }

        .why-visual::before {
            content: "";
            position: absolute;
            inset: 45px;
            border: 1px solid rgba(234,179,8,0.18);
            border-radius: 50%;
        }

        .why-visual::after {
            content: "";
            position:
