<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- Language Pairs -->
  <section class="section bg-white" id="languages">
    <div class="container">
      <div class="text-center mx-auto reveal" style="max-width:600px;margin-bottom:2rem;">
        <h2>Language Pairs</h2>
        <p class="lead" style="margin:1rem auto 0;">Major language combinations we support regularly. Need something else? Just ask.</p>
      </div>
      <div class="filter-btns reveal">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="european">European</button>
        <button class="filter-btn" data-filter="asian">Asian</button>
        <button class="filter-btn" data-filter="middle-eastern">Middle Eastern</button>
        <button class="filter-btn" data-filter="americas">Americas</button>
      </div>
      <div class="lang-grid">
        <div class="lang-card" data-region="european"><div class="lang-pair">English ↔ Spanish</div><div class="lang-region">European / Americas</div></div>
        <div class="lang-card" data-region="european"><div class="lang-pair">English ↔ German</div><div class="lang-region">European</div></div>
        <div class="lang-card" data-region="european"><div class="lang-pair">English ↔ French</div><div class="lang-region">European</div></div>
        <div class="lang-card" data-region="asian"><div class="lang-pair">English ↔ Mandarin</div><div class="lang-region">Asian</div></div>
        <div class="lang-card" data-region="asian"><div class="lang-pair">English ↔ Japanese</div><div class="lang-region">Asian</div></div>
        <div class="lang-card" data-region="middle-eastern"><div class="lang-pair">English ↔ Arabic</div><div class="lang-region">Middle Eastern</div></div>
        <div class="lang-card" data-region="european"><div class="lang-pair">English ↔ Portuguese</div><div class="lang-region">European / Americas</div></div>
        <div class="lang-card" data-region="european"><div class="lang-pair">English ↔ Italian</div><div class="lang-region">European</div></div>
        <div class="lang-card" data-region="european"><div class="lang-pair">English ↔ Dutch</div><div class="lang-region">European</div></div>
        <div class="lang-card" data-region="asian"><div class="lang-pair">English ↔ Korean</div><div class="lang-region">Asian</div></div>
      </div>
      <div class="text-center" style="margin-top:2.5rem;">
        <p style="margin-bottom:1rem;color:var(--gray-700);">Don't see your language pair?</p>
        <a href="contact.html#quote" class="btn btn-primary">Ask About Your Language</a>
      </div>
    </div>
  </section>
